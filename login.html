<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — STACKLY</title>
<link rel="icon" type="image/svg+xml" href="svg/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body" data-no-preloader data-no-glow data-light-header>
<a href="index.html" class="auth-back"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to Home</a>
<div class="auth-shell">
  <div class="auth-head">
    <a href="index.html" class="brand auth-brand" aria-label="STACKLY home">
      <img src="img/logo.webp" alt="" width="58" height="58">
      <span class="brand-text"><strong>STACKLY</strong><small>Small Acts. Big Change.</small></span>
    </a>
    <h1>Welcome Back</h1>
    <p>Login to your STACKLY account to track your impact.</p>
  </div>
  <div class="auth-msg" id="authMsg" aria-live="polite"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" data-f="email" placeholder="you@example.com" autocomplete="email"><span class="err">Enter a valid email.</span></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" data-f="password" placeholder="Your password" autocomplete="current-password"><span class="pass-toggle" role="button" tabindex="0" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="err">Password must be at least 6 characters.</span></div>
    <div class="field"><label for="lRole">Login As</label><select id="lRole" data-f="role"><option value="user">User (Donor / Volunteer)</option><option value="admin">Admin (Organization)</option></select></div>
    <div class="auth-row"><label><input type="checkbox" checked> Remember me</label><a href="#" onclick="return false">Forgot password?</a></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
  </form>
  <p class="auth-alt">New to STACKLY? <a href="register.html">Create an account</a></p>
</div>
<script src="js/main.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
